services:
  api:
    build:
      context: ../..
      dockerfile: services/revenue/Dockerfile
    env_file: .env
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - revenue-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health')"]
      interval: 30s
      timeout: 5s
      retries: 3
  worker:
    build:
      context: ../..
      dockerfile: services/revenue/Dockerfile
    env_file: .env
    command: ["python", "-m", "services.revenue.worker"]
    volumes:
      - revenue-data:/data
    restart: unless-stopped
volumes:
  revenue-data:
