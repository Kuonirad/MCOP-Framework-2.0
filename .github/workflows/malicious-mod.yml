name: CI Security - Malicious Mod Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-malicious-load:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup project environment
        uses: ./.github/actions/setup-project
        with:
          install-deps: 'false'

      - name: Execute malicious-mod harness
        run: node scripts/security/test-malicious-mod.mjs
